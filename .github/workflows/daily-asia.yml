name: 아시아장 업데이트
run-name: 아시아장만 갱신 · ${{  github.event_name  }}
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5' # 한국시간 평일 17:30
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    uses: ./.github/workflows/publish-market.yml
    with:
      market: asia
