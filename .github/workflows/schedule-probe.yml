name: 예약 트리거 독립 진단
run-name: 예약 진단 · ${{ github.event_name }}
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 0-2 18 11 *' # TEMP: 2026-11-18 KST 오전 진단 후 삭제
permissions: {}
jobs:
  timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: UTC 시각과 실행 이벤트 확인
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          printf 'event=%s\nschedule=%s\n' "$EVENT_NAME" "$SCHEDULE"
