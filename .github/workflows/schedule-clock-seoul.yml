name: 시간대 비교 Seoul
run-name: Asia Seoul explicit · ${{ github.event_name }}
on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'
      timezone: Asia/Seoul
permissions:
  actions: read
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      PROBE_LABEL: 'Asia Seoul explicit'
      CURRENT_CRON: '5 * * * *'
      TRIGGER_EVENT: ${{ github.event_name }}
      TRIGGER_CRON: ${{ github.event.schedule }}
    steps:
      - name: Compare clocks and run creation time
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const observed = new Date();
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`, {
              headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'},
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw Error('Run API HTTP '+response.status);
            const run = await response.json();
            const created = Date.parse(run.created_at);
            const comparable = process.env.TRIGGER_EVENT === 'schedule' && process.env.TRIGGER_CRON === process.env.CURRENT_CRON;
            const reference = new Date(created);
            reference.setUTCMinutes(5,0,0);
            if (reference.getTime() > created) reference.setUTCHours(reference.getUTCHours()-1);
            const previousResponse = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/${run.workflow_id}/runs?event=schedule&per_page=20`, {
              headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'},
              signal: AbortSignal.timeout(15000)
            });
            if (!previousResponse.ok) throw Error('Previous runs API HTTP '+previousResponse.status);
            const previousRuns = await previousResponse.json();
            const previous = previousRuns.workflow_runs.filter(r=>String(r.id)!==String(run.id)&&Date.parse(r.created_at)<created).sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))[0];
            const result = {
              probe: process.env.PROBE_LABEL,
              event: process.env.TRIGGER_EVENT,
              triggered_cron: process.env.TRIGGER_CRON || null,
              configured_cron: process.env.CURRENT_CRON,
              reference_slot_utc: comparable ? reference.toISOString() : null,
              reference_note: 'Nearest prior :05 slot, not the original scheduled-event timestamp',
              run_created_utc: run.created_at,
              run_started_utc: run.run_started_at,
              runner_utc: observed.toISOString(),
              runner_kst: new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Seoul',dateStyle:'short',timeStyle:'medium'}).format(observed)+' +09:00',
              github_http_date: response.headers.get('date'),
              seconds_since_reference_slot: comparable ? (created-reference.getTime())/1000 : null,
              previous_schedule_run_utc: previous?.created_at || null,
              schedule_run_interval_seconds: process.env.TRIGGER_EVENT === 'schedule' && previous ? (created-Date.parse(previous.created_at))/1000 : null,
              runner_minus_created_seconds: (observed-Date.parse(run.created_at))/1000,
              url: run.html_url
            };
            console.log(JSON.stringify(result,null,2));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n'+JSON.stringify(result,null,2)+'\n```\n');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE