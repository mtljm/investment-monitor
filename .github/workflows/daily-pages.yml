name: 화면 배포 및 선택 업데이트
run-name: 화면 배포 · ${{  github.event_name  }} · ${{  inputs.market || 'auto'  }}
on:
  workflow_dispatch:
    inputs:
      market:
        description: 업데이트 대상 (reuse는 양쪽 데이터 유지)
        type: choice
        options: [us, asia, gurus, all, reuse]
        default: reuse
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'templates/**'
      - 'config/**'
      - 'tests/**'
      - 'README.md'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      market: ${{  steps.plan.outputs.market  }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: 업데이트 범위 결정
        id: plan
        env:
          BEFORE_SHA: ${{  github.event.before  }}
          PUBLISH_MARKET: ${{  inputs.market  }}
        run: node scripts/pages-mode.mjs
  publish:
    needs: plan
    uses: ./.github/workflows/publish-market.yml
    with:
      market: ${{  needs.plan.outputs.market  }}

