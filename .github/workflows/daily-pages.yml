name: Pages 시장 대시보드
run-name: 시장 데이터 또는 화면 갱신 · ${{ github.event_name }}
on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 새 시세 수집 (해제하면 게시 데이터로 화면만 배포 수기 수정)
        type: boolean
        default: true
  schedule:
    - cron: '35 1 * * *' # 다음 날 한국시간 10:35 목표
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-pages.yml'
      - 'scripts/prepare-pages.mjs'
      - 'scripts/reuse-pages.mjs'
      - 'scripts/pages-mode.mjs'
      - 'scripts/collect-asia.mjs'
      - 'scripts/dashboard-template.mjs'
      - 'scripts/render-dashboard.mjs'
      - 'templates/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/fetch-market.mjs'
      - 'scripts/market-analysis.mjs'
      - 'scripts/monitor.mjs'
      - 'scripts/high52.mjs'
      - 'scripts/technical-indicators.mjs'
      - 'scripts/chart-series.mjs'
      - 'scripts/dashboard-context.mjs'

permissions:
  contents: read

concurrency:
  group: market-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: 구성 및 지표 검증
        run: node --test tests/*.test.mjs
      - name: 수집 여부 결정
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REFRESH_DATA: ${{ inputs.refresh_data }}
        run: node scripts/pages-mode.mjs
      - name: 이전 결과 제거
        run: |
          node --input-type=module <<'NODE'
          import {rmSync} from 'node:fs';
          for(const path of ['reports/latest.json','reports/latest.md','dashboard.html']) rmSync(path,{force:true});
          rmSync('public-site',{recursive:true,force:true});
          NODE
      - name: 아시아 지수 별도 수집
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/collect-asia.mjs
      - name: 대형주 20개와 지수·지표·ETF 23개 수집
        if: steps.plan.outputs.mode == 'collect'
        timeout-minutes: 6
        run: node scripts/monitor.mjs --limit 20
      - name: 공개 화면과 90일 비교 이력 생성
        if: steps.plan.outputs.mode == 'collect'
        env:
          PAGES_HISTORY_URL: https://mtljm.github.io/investment-monitor/history.json
        run: node scripts/prepare-pages.mjs
      - name: 기존 데이터로 화면만 생성 (시세 API 호출 없음)
        if: steps.plan.outputs.mode == 'reuse'
        env:
          PAGES_BASE_URL: https://mtljm.github.io/investment-monitor/
        run: node scripts/reuse-pages.mjs
      - name: Pages 설정 확인
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: 사이트만 업로드
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public-site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 게시
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e





