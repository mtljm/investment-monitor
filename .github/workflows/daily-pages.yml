name: 01 시장 · 예약 및 화면 갱신
run-name: 01 시장 · ${{ github.event_name }} · ${{ inputs.market || github.event.schedule || 'auto' }}
on:
  workflow_dispatch:
    inputs:
      market:
        description: 업데이트 대상 (reuse는 미국·아시아·기관 자료 유지)
        type: choice
        options: [us, asia, gurus, all, reuse]
        default: reuse
  schedule:
    - cron: '37 22 * * *' # 미국: 매일 07:37 KST
    - cron: '30 8 * * 1-5' # 아시아: 평일 17:30 KST
    - cron: '0 23 * * 5' # 기관: 토요일 08:00 KST
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'templates/**'
      - 'config/**'
      - 'tests/**'
      - 'README.md'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      market: ${{  steps.plan.outputs.market  }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: 업데이트 범위 결정
        id: plan
        env:
          EVENT_CRON: ${{ github.event.schedule }}
          BEFORE_SHA: ${{  github.event.before  }}
          PUBLISH_MARKET: ${{  inputs.market  }}
        run: node scripts/pages-mode.mjs
  publish:
    needs: plan
    uses: ./.github/workflows/publish-market.yml
    with:
      market: ${{  needs.plan.outputs.market  }}

